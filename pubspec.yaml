name: chartee
description: Chartee is a versatile library supporting line, bar, and area charts for Flutter applications. Easily visualize data with customizable styles.
version: 1.0.17
homepage: https://github.com/chargee-energy/chartee

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  collection: ^1.17.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  chargee_lints: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
